<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body {
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <nav class="bg-white border-b border-slate-100 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold">M</div>
                    <span class="font-bold text-slate-800 text-lg">會員中心</span>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/userlist" class="text-sm text-slate-600 hover:text-indigo-600 font-medium px-3 py-2 rounded-lg hover:bg-slate-50 transition-all duration-200">管理會員</a>
                    <a href="/logout" class="text-sm text-rose-600 hover:text-rose-700 font-medium px-3 py-2 rounded-lg hover:bg-rose-50 transition-all duration-200">登出</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-2xl mx-auto px-4 py-12">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
            <div class="h-32 bg-gradient-to-r from-indigo-500 to-purple-600 relative">
                <div class="absolute -bottom-12 left-8">
                    <div class="w-24 h-24 rounded-2xl bg-white p-1 shadow-md flex items-center justify-center">
                        <div class="w-full h-full rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center">
                            <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pt-16 pb-8 px-8">
                <div class="mb-6">
                    <h1 class="text-2xl font-bold text-slate-800">{{ user.username }}</h1>
                    {% if user.username == "admin" %}
                    <p class="text-sm text-slate-500 mt-1">管理員</p>
                    {% else %}
                    <p class="text-sm text-slate-500 mt-1">一般會員</p>
                    {% endif %}
                </div>
                <div class="border-t border-slate-100 pt-6 space-y-6">
                    <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">帳戶資訊</h3>                   
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                            <div class="text-slate-400 text-xs font-medium mb-1">使用者帳號</div>
                            <div class="flex items-center gap-2 text-slate-800 font-semibold">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                <span>{{ user.username }}</span>
                            </div>
                        </div>
                        <div class="bg-slate-50 rounded-xl p-4 border border-slate-100">
                            <div class="text-slate-400 text-xs font-medium mb-1">電子信箱</div>
                            <div class="flex items-center gap-2 text-slate-800 font-semibold">
                                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                                </svg>
                                <span>{{ user.email }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
